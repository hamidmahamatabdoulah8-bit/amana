<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amana</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#5f5e5a;--card:#f5f5f2;--bd:#dcdbd3;--cream:#FFF6D1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171b;--fg:#f0efe9;--mut:#a8a7a0;--card:#22242a;--bd:#363840;--cream:#2d2a14}}
:root[data-theme="dark"]{--bg:#15171b;--fg:#f0efe9;--mut:#a8a7a0;--card:#22242a;--bd:#363840;--cream:#2d2a14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:480px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{display:flex;height:8px}.bar i{flex:1}.bar i:nth-child(1){background:#002664}.bar i:nth-child(2){background:#FECB00}.bar i:nth-child(3){background:#C60C30}
.hd{background:#002664;color:#fff;padding:14px 16px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:17px}
.logo s{width:28px;height:28px;border-radius:8px;background:#FECB00;color:#002664;display:grid;place-items:center;text-decoration:none;font-weight:700}
.back{cursor:pointer;margin-right:12px;font-size:18px}
.c{padding:16px}
h1{font-size:24px;line-height:1.25;margin:4px 0 6px}h2{font-size:19px;margin:0 0 12px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px;font:600 15px system-ui,sans-serif;cursor:pointer;margin-top:10px}
.y{background:#FECB00;color:#002664}.b{background:#002664;color:#fff}.r{background:#C60C30;color:#fff}.o{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:16px;background:var(--bg);color:var(--fg);margin:4px 0 10px}
.tag{font-size:12px;padding:3px 9px;border-radius:8px;background:#E1F5EE;color:#085041;display:inline-block}
.cream{background:var(--cream);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.m{color:var(--mut);font-size:13px}.err{color:#C60C30;font-size:13px;min-height:18px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--fg);font-size:15px;cursor:pointer}.seg .on{background:#002664;color:#fff;border-color:#002664}
.ft{background:#0F6E56;color:#fff;text-align:center;padding:12px;font-size:13px}
.nav{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd)}.nav a{flex:1;text-align:center;padding:13px;font-size:14px;font-weight:600;cursor:pointer}
.th{height:70px;border-radius:10px;display:grid;place-items:center;font-size:26px;font-weight:700;margin-bottom:8px}
.st{display:flex;gap:10px;align-items:center;margin:10px 0}.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:1px solid var(--bd)}.dot.ok{background:#0F6E56;color:#fff;border-color:#0F6E56}
.vis{position:relative;overflow:hidden;border-radius:12px;display:grid;place-items:center;margin-bottom:8px}
.vis b{font-size:inherit;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.vis:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sh 3.5s infinite}
.vis i{position:absolute;font-style:normal;font-size:14px;animation:tw 2s ease-in-out infinite}
.pc{transition:transform .2s}.pc:active{transform:scale(.97)}
.pop{animation:pp .6s ease-out}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes sh{0%{left:-60%}60%,100%{left:130%}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes pp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.vis b,.vis:after,.vis i,.pop{animation:none}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var sb=supabase.createClient('https://xmwmvttdincaknenwzkb.supabase.co','sb_publishable_XA2wk2puSVd4w7u7GiFhzA_GXnKUUxn');
var COL=[['#E6F1FB','#185FA5'],['#FAEEDA','#854F0B'],['#E1F5EE','#085041'],['#FCEBEB','#A32D2D']];
var EM=['👜','📱','👟','👗','👕','⌚','💻','🎧','🧴','📦'];
var S={screen:'home',user:null,prof:null,P:[],O:[],pid:null,err:'',mode:'in',role:'buy',pop:'airtel',pe:'👜',busy:false};
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function f(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' FCFA'}
function dl(p){return p.delivery_fee>0?f(p.delivery_fee):'Gratuite'}
function opn(o){return o=='airtel'?'Airtel Money':'Moov Money'}
function cur(){return S.P.find(function(x){return x.id==S.pid})}
function vis(p,h,fs,i){var c=COL[(i||0)%4];return '<div class="vis" style="height:'+h+'px;font-size:'+fs+'px;background:linear-gradient(135deg,'+c[0]+',#fff8);color:'+c[1]+'"><i style="top:10%;left:12%">✨</i><i style="top:20%;right:14%;animation-delay:.7s">✨</i><i style="bottom:12%;left:22%;animation-delay:1.3s">✨</i><b>'+(p.emoji||'📦')+'</b></div>'}
function hd(b){return '<div class="bar"><i></i><i></i><i></i></div><div class="hd">'+(b?'<span class="back" onclick="go(\''+b+'\')">←</span>':'')+'<span class="logo"><s>A</s>Amana</span></div>'}
function ft(){return '<div class="ft">Paiement protégé par Amana</div>'}
function nav(){return '<div class="nav"><a onclick="go(\'list\')">Acheter</a><a onclick="go(\'orders\')">Mes achats</a><a onclick="go(\'dash\')">Vendre</a></div>'}
function inp(id,ph,t){return '<input '+(t?'type="'+t+'" inputmode="'+(t=='tel'?'numeric':'text')+'" ':'')+'placeholder="'+ph+'" value="'+esc(S[id])+'" oninput="S.'+id+'=this.value">'}
function need(s){if(!S.user){S.next=s;S.screen='auth';S.err='';render();return false}return true}
function go(s,x){if(['pay','orders','dash'].indexOf(s)>-1&&!need(s))return;S.screen=s;if(x!==undefined)S.pid=x;S.err='';render();scrollTo(0,0);refresh()}
async function refresh(){var r=await sb.from('products').select('*').order('created_at',{ascending:false});S.P=r.data||[];if(S.user){var o=await sb.from('orders').select('*, products(name,emoji)').order('created_at',{ascending:false});S.O=o.data||[]}if(!/^(auth|pay)$/.test(S.screen)&&!document.activeElement.matches('input,select'))render()}
function home(){return hd()+'<div class="c"><div class="cream"><h2 style="margin-top:0">Achetez et vendez sans arnaque</h2><p class="m">Votre argent reste protégé par Amana jusqu\'à la livraison confirmée. Paiement par Airtel Money ou Moov Money.</p></div><button class="btn y" onclick="go(\'list\')">Voir les produits</button><button class="btn o" onclick="go(\'dash\')">Je veux vendre</button>'+(S.user?'<button class="btn o" onclick="out()">Se déconnecter</button>':'<button class="btn o" onclick="S.next=\'list\';go(\'auth\')">Connexion / Inscription</button>')+'</div>'+ft()}
function list(){var r=S.P.map(function(p,i){return '<div class="card pc pop" onclick="go(\'prod\','+p.id+')" style="cursor:pointer">'+vis(p,110,52,i)+'<div class="row"><b>'+esc(p.name)+'</b><b>'+f(p.price)+'</b></div><div class="row"><span class="m">'+esc(p.seller_name||'Vendeur')+'</span><span class="tag">Paiement protégé</span></div><div class="m" style="margin-top:4px">🚚 Livraison : <b>'+dl(p)+'</b></div></div>'}).join('');return hd('home')+'<div class="c"><h2>Produits</h2>'+(r||'<p class="m">Aucun produit pour le moment. Les vendeurs peuvent en ajouter dans « Vendre ».</p>')+'</div>'+nav()}
function prod(){var p=cur();if(!p)return hd('list')+'<div class="c"><p class="m">Chargement…</p></div>';return hd('list')+'<div class="c">'+vis(p,190,88,S.P.indexOf(p))+'<h2 style="margin:0">'+esc(p.name)+'</h2><b style="font-size:20px">'+f(p.price)+'</b><p class="m">Vendu par '+esc(p.seller_name||'Vendeur')+'<br>🚚 Livraison : '+dl(p)+' · fixée par le vendeur</p><div class="cream"><b>Comment ça marche ?</b><br><span class="m">Vous payez à Amana. Le vendeur envoie. Vous confirmez la réception, puis Amana paie le vendeur.</span></div><button class="btn y" onclick="go(\'pay\')">Acheter en sécurité</button></div>'+nav()}
function pay(){var p=cur();if(!p)return home();var t=p.price+(p.delivery_fee||0);return hd('prod')+'<div class="c"><h2>Paiement</h2><div class="card"><div class="row"><span>'+esc(p.name)+'</span><span>'+f(p.price)+'</span></div><div class="row"><span>Livraison</span><span>'+dl(p)+'</span></div><div class="row"><b>Total</b><b>'+f(t)+'</b></div></div><h2>Où te livrer ?</h2>'+inp('dv','Ville (N\'Djamena, Moundou…)')+inp('dq','Quartier')+inp('dr','Repère connu (derrière la pharmacie X)')+inp('dt','Ton numéro (le livreur t\'appelle)','tel')+'<div class="cream m">Le vendeur voit ces infos seulement après ton paiement.</div><div class="seg"><button class="'+(S.op!='moov'?'on':'')+'" onclick="S.op=\'airtel\';render()">Airtel Money</button><button class="'+(S.op=='moov'?'on':'')+'" onclick="S.op=\'moov\';render()">Moov Money</button></div><div class="cream m">⚠️ Test : le vrai paiement Mobile Money sera branché plus tard. Aucun argent n\'est pris.</div><div class="err">'+esc(S.err)+'</div><button class="btn y" onclick="doPay()">'+(S.busy?'Patientez…':'Payer '+f(t))+'</button></div>'+ft()}
async function doPay(){var p=cur();if(S.busy)return;if(p.seller_id==S.user.id){S.err='Vous ne pouvez pas acheter votre propre produit.';return render()}if(!(S.dv||'').trim()||!(S.dq||'').trim()||!(S.dr||'').trim()||(S.dt||'').replace(/\D/g,'').length<8){S.err='Remplissez la ville, le quartier, le repère et le téléphone.';return render()}S.busy=true;render();var r=await sb.from('orders').insert({product_id:p.id,buyer_id:S.user.id,seller_id:p.seller_id,total:p.price+(p.delivery_fee||0),status:'paid',d_city:S.dv,d_area:S.dq,d_landmark:S.dr,d_phone:S.dt});S.busy=false;if(r.error){S.err=r.error.message;return render()}go('orders')}
var LAB={paid:'Payé, en préparation',shipped:'En livraison',done:'Terminée'};
function orders(){var r=S.O.filter(function(o){return o.buyer_id==S.user.id}).map(function(o){return '<div class="card"><div class="row"><b>'+esc(o.products&&o.products.name)+'</b><b>'+f(o.total)+'</b></div><span class="tag">'+LAB[o.status]+'</span>'+(o.status=='shipped'?'<button class="btn y" onclick="setSt('+o.id+',\'done\')">J\'ai reçu mon produit</button>':'')+(o.status=='paid'?'<p class="m">Le vendeur prépare votre commande. Votre argent est protégé.</p>':'')+'</div>'}).join('');return hd('list')+'<div class="c"><h2>Mes achats</h2>'+(r||'<p class="m">Aucun achat pour le moment.</p>')+'<button class="btn o" onclick="out()">Se déconnecter</button></div>'+nav()}
async function setSt(id,st){await sb.from('orders').update({status:st}).eq('id',id);refresh()}
function dash(){var pr=S.prof;if(!pr||pr.role!='seller')return hd('home')+'<div class="c"><h2>Devenir vendeur</h2><div class="cream"><b>Comment voulez-vous recevoir votre argent ?</b><div class="seg" style="margin:8px 0"><button class="'+(S.pop!='moov'?'on':'')+'" onclick="S.pop=\'airtel\';render()">Airtel Money</button><button class="'+(S.pop=='moov'?'on':'')+'" onclick="S.pop=\'moov\';render()">Moov Money</button></div>'+inp('pp','Numéro '+opn(S.pop),'tel')+'</div><div class="err">'+esc(S.err)+'</div><button class="btn y" onclick="beSeller()">Devenir vendeur</button></div>'+nav();var w=0,d=0,rows=S.O.filter(function(o){return o.seller_id==S.user.id}).map(function(o){if(o.status=='done')d+=o.total;else w+=o.total;return '<div class="card"><div class="row"><b>'+esc(o.products&&o.products.name)+'</b><b>'+f(o.total)+'</b></div><span class="tag">'+LAB[o.status]+'</span><div class="m" style="margin-top:6px"><b>Livrer à :</b> '+esc(o.d_city)+', '+esc(o.d_area)+'<br>Repère : '+esc(o.d_landmark)+'<br>Tél : '+esc(o.d_phone)+'</div>'+(o.status=='paid'?'<button class="btn b" onclick="setSt('+o.id+',\'shipped\')">Marquer comme envoyé</button>':'')+(o.status=='shipped'?'<p class="m">Vous serez payé dès que le client confirme.</p>':'')+'</div>'}).join('');return hd('home')+'<div class="c"><h2>Espace vendeur</h2><div class="row" style="align-items:stretch"><div class="cream" style="flex:1;margin:0"><span class="m">En attente</span><br><b style="font-size:18px">'+f(w)+'</b><br><span class="m">gardé par Amana</span></div><div class="card" style="flex:1;margin:0;background:#E1F5EE;color:#085041"><span style="font-size:13px">Déjà reçu</span><br><b style="font-size:18px">'+f(d)+'</b></div></div><div class="card" style="margin-top:10px"><b>Payé sur '+opn(pr.payout_operator)+'</b><br><span class="m">+235 '+esc(pr.payout_number)+'</span></div><h2>Mes commandes</h2>'+(rows||'<p class="m">Aucune commande pour le moment.</p>')+'<h2 style="margin-top:18px">Ajouter un produit</h2>'+inp('pn','Nom du produit')+inp('pv','Prix en FCFA','tel')+inp('pd','Prix de livraison (0 = gratuite)','tel')+'<p class="m" style="margin:0">Choisissez une image</p><select style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:16px;margin:4px 0 10px" onchange="S.pe=this.value">'+EM.map(function(e){return '<option'+(e==S.pe?' selected':'')+'>'+e+'</option>'}).join('')+'</select><div class="err">'+esc(S.err)+'</div><button class="btn y" onclick="addP()">Publier le produit</button><button class="btn o" onclick="out()">Se déconnecter</button></div>'+nav()}
async function beSeller(){if((S.pp||'').replace(/\D/g,'').length<8){S.err='Entrez votre numéro Mobile Money.';return render()}var pr=Object.assign({},S.prof||{id:S.user.id},{role:'seller',payout_operator:S.pop,payout_number:S.pp});var r=await sb.from('profiles').upsert(pr);if(r.error){S.err=r.error.message;return render()}S.prof=pr;render()}
async function addP(){var n=(S.pn||'').trim(),v=+S.pv;if(!n||!(v>0)){S.err='Entrez un nom et un prix.';return render()}var r=await sb.from('products').insert({seller_id:S.user.id,seller_name:S.prof.name,name:n,price:v,delivery_fee:Math.max(0,+S.pd||0),emoji:S.pe});if(r.error){S.err=r.error.message;return render()}S.pn=S.pv=S.pd='';S.err='';await refresh();render()}
function auth(){var up=S.mode=='up';return hd('home')+'<div class="c"><h2>'+(up?'Créer votre compte':'Connexion')+'</h2><div class="seg"><button class="'+(!up?'on':'')+'" onclick="S.mode=\'in\';render()">Connexion</button><button class="'+(up?'on':'')+'" onclick="S.mode=\'up\';render()">Inscription</button></div>'+(up?inp('name','Nom complet')+inp('phone','Téléphone (+235)','tel'):'')+inp('em','Email','email')+'<input type="password" placeholder="Mot de passe (6 caractères minimum)" oninput="S.pw=this.value">'+(up?'<p class="m">Pour vendre, vous donnerez votre numéro Mobile Money dans « Vendre ».</p>':'')+'<div class="err">'+esc(S.err)+'</div><button class="btn y" onclick="doAuth()">'+(up?'Créer mon compte':'Me connecter')+'</button></div>'+ft()}
async function doAuth(){var e=(S.em||'').trim(),p=S.pw||'';S.err='';if(!e||p.length<6){S.err='Entrez un email et un mot de passe (6 caractères minimum).';return render()}if(S.mode=='up'){if(!(S.name||'').trim()){S.err='Entrez votre nom.';return render()}var r=await sb.auth.signUp({email:e,password:p});if(r.error){S.err=r.error.message;return render()}if(!r.data.session){S.err='Compte créé. Confirmez votre email, puis connectez-vous.';S.mode='in';return render()}S.user=r.data.user;S.prof={id:S.user.id,name:S.name.trim(),phone:S.phone,role:'buyer'};await sb.from('profiles').upsert(S.prof)}else{var r2=await sb.auth.signInWithPassword({email:e,password:p});if(r2.error){S.err='Email ou mot de passe incorrect.';return render()}S.user=r2.data.user;var q=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();S.prof=q.data}go(S.next||'list')}
async function out(){await sb.auth.signOut();S.user=S.prof=null;S.O=[];go('home')}
function render(){var m={home:home,list:list,prod:prod,pay:pay,orders:orders,dash:dash,auth:auth};document.getElementById('app').innerHTML=m[S.screen]()}
(async function(){var g=await sb.auth.getSession();if(g.data.session){S.user=g.data.session.user;var q=await sb.from('profiles').select('*').eq('id',S.user.id).maybeSingle();S.prof=q.data}render();refresh()})();
</script></body></html>
